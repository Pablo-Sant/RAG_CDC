name: Fly Deploy
on:
  push:
    branches:
      - main  # Ajuste se a sua branch for master

jobs:
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # O PULO DO GATO: --local-only força o build dentro do próprio GitHub Actions
      - name: Deploy to Fly
        run: flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}