name: Fly Deploy
on:
  push:
    branches:
      - main  # Ou 'master', mude para a sua branch principal

jobs:
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    concurrency: deploy-group    # Evita deploys simultâneos
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --remote-only=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}